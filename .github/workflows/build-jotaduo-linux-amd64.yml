# Build do goneonize patchado (linux/amd64) para a wheel neonize 0.4.3.1 do
# jotaDuo. Disparo manual; o artifact é baixado e reempacotado fora do CI.
name: build-jotaduo-linux-amd64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: goneonize/go.sum
      - name: Compila goneonize c-shared
        working-directory: goneonize
        env:
          CGO_ENABLED: "1"
        # O tools/goneonize.py upstream compila só main.go, mas bufPool vive
        # em helpers.go (package main): compilar o package inteiro.
        run: go build -buildmode=c-shared -ldflags=-s -o neonize-linux-amd64.so .
      - name: Valida GetVersion do binário
        working-directory: goneonize
        # O load_goneonize da wheel compara GetVersion() com
        # __GONEONIZE_VERSION__ e, se diferir, baixa o binário oficial do
        # upstream POR CIMA — foi assim que o .so patchado foi substituído em
        # produção (version.go da tag respondia "0.3.13"). Este gate impede
        # publicar um .so que se autodestrói.
        run: |
          python3 - << 'EOF'
          import ctypes
          g = ctypes.CDLL("./neonize-linux-amd64.so")
          g.GetVersion.restype = ctypes.c_char_p
          v = g.GetVersion().decode()
          print("GetVersion:", v)
          assert v == "0.4.3.post0", f"GetVersion {v!r} != '0.4.3.post0'"
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: neonize-linux-amd64
          path: goneonize/neonize-linux-amd64.so
          if-no-files-found: error
